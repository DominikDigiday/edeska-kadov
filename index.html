<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Úřední deska</title>
<style>
    :root {
        --bg: transparent;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --text: #111827;
        --muted: #6b7280;
        --tag-bg: #eef0f3;
        --tag-text: #1f2937;
        --link: #2563eb;
        --btn-border: #d1d5db;
        --btn-disabled: #9ca3af;
        --radius: 12px;
        --gap: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        line-height: 1.45;
    }

    .edeska {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px;
    }

    .edeska__list {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
    }

    .item {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        padding: 16px 20px;
    }

    .item__meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
    }

    .item__tag {
        background: var(--tag-bg);
        color: var(--tag-text);
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 13px;
        line-height: 1.3;
    }

    .item__date {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: 1px solid var(--card-border);
        border-radius: 999px;
        padding: 3px 12px;
        color: var(--text);
        font-size: 13px;
    }

    .item__date svg { flex: none; }

    .item__title {
        margin: 0 0 10px;
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
    }

    .item__link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--link);
        text-decoration: none;
        font-size: 14px;
    }
    .item__link:hover { text-decoration: underline; }

    .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 24px;
        padding: 6px 4px;
    }

    .pager__btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: 1px solid var(--btn-border);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 14px;
        color: var(--text);
        cursor: pointer;
        font-family: inherit;
    }
    .pager__btn:hover:not([disabled]) { background: #f9fafb; }
    .pager__btn[disabled] {
        color: var(--btn-disabled);
        cursor: not-allowed;
    }

    .pager__info {
        color: var(--muted);
        font-size: 14px;
    }

    .state {
        text-align: center;
        padding: 32px 16px;
        color: var(--muted);
    }
    .state--error { color: #b91c1c; }

    @media (max-width: 480px) {
        .edeska { padding: 10px; }
        .item { padding: 14px 16px; }
        .pager { flex-wrap: wrap; gap: 10px; justify-content: center; }
    }
</style>
</head>
<body>
<div class="edeska" id="edeska">
    <div class="state" id="state">Načítám úřední desku…</div>
    <div class="edeska__list" id="list" hidden></div>
    <div class="pager" id="pager" hidden>
        <button class="pager__btn" id="prev" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Předchozí
        </button>
        <span class="pager__info" id="info"></span>
        <button class="pager__btn" id="next" type="button">
            Další
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>
</div>

<script>
(function () {
    'use strict';

    // === KONFIGURÁCIA =======================================================
    // imunis.cz posiela 'access-control-allow-origin: *', takže fetch funguje
    // priamo z prehliadača bez proxy. Ak by sa to v budúcnosti zmenilo, použi
    // priložený proxy.php a nastav FEED_URL = 'proxy.php'.
    var FEED_URL = 'https://kadov.imunis.cz/edeska/feed/rss';
    var PER_PAGE = 5;
    // ========================================================================

    var $list  = document.getElementById('list');
    var $state = document.getElementById('state');
    var $pager = document.getElementById('pager');
    var $prev  = document.getElementById('prev');
    var $next  = document.getElementById('next');
    var $info  = document.getElementById('info');

    var items = [];
    var page  = 1;

    function showError(msg) {
        $state.textContent = msg;
        $state.classList.add('state--error');
        $state.hidden = false;
    }

    function formatDate(rfc822) {
        var d = new Date(rfc822);
        if (isNaN(d.getTime())) return rfc822 || '';
        var dd = String(d.getDate()).padStart(2, '0');
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        var yy = d.getFullYear();
        return dd + '. ' + mm + '. ' + yy;
    }

    function parseFeed(xmlText) {
        var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
        if (doc.querySelector('parsererror')) {
            throw new Error('Nepodařilo se zpracovat RSS feed.');
        }
        var nodes = doc.querySelectorAll('item');
        var out = [];
        for (var i = 0; i < nodes.length; i++) {
            var n = nodes[i];
            var get = function (sel) {
                var el = n.querySelector(sel);
                return el ? el.textContent.trim() : '';
            };
            out.push({
                title:    get('title'),
                link:     get('link') || get('guid'),
                category: get('category'),
                pubDate:  get('pubDate')
            });
        }
        return out;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function calendarSvg() {
        return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
    }

    function externalSvg() {
        return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
    }

    function render() {
        var totalPages = Math.max(1, Math.ceil(items.length / PER_PAGE));
        if (page > totalPages) page = totalPages;

        var start = (page - 1) * PER_PAGE;
        var slice = items.slice(start, start + PER_PAGE);

        if (slice.length === 0) {
            $state.textContent = 'V úřední desce nejsou žádné záznamy.';
            $state.hidden = false;
            $list.hidden = true;
            $pager.hidden = true;
            return;
        }

        $state.hidden = true;
        $list.hidden = false;

        var html = '';
        for (var i = 0; i < slice.length; i++) {
            var it = slice[i];
            html += '<article class="item">' +
                      '<div class="item__meta">' +
                        (it.category ? '<span class="item__tag">' + escapeHtml(it.category) + '</span>' : '') +
                        '<span class="item__date">' + calendarSvg() + escapeHtml(formatDate(it.pubDate)) + '</span>' +
                      '</div>' +
                      '<h3 class="item__title">' + escapeHtml(it.title) + '</h3>' +
                      (it.link
                        ? '<a class="item__link" href="' + encodeURI(it.link) + '" target="_blank" rel="noopener">Zobrazit detail ' + externalSvg() + '</a>'
                        : '') +
                    '</article>';
        }
        $list.innerHTML = html;

        $pager.hidden = totalPages <= 1;
        $info.textContent = 'Strana ' + page + ' z ' + totalPages;
        $prev.disabled = page <= 1;
        $next.disabled = page >= totalPages;
    }

    $prev.addEventListener('click', function () {
        if (page > 1) { page--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
    $next.addEventListener('click', function () {
        var totalPages = Math.ceil(items.length / PER_PAGE);
        if (page < totalPages) { page++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });

    fetch(FEED_URL, { cache: 'no-store' })
        .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
        })
        .then(function (xml) {
            items = parseFeed(xml);
            render();
        })
        .catch(function (err) {
            showError('Úřední desku se nepodařilo načíst (' + err.message + ').');
        });
})();
</script>
</body>
</html>
